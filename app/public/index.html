<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI 비서 — 에이미 & 제임스</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>AI 비서</h1>
    <div class="members" id="members" aria-label="대화 참여자"></div>
    <button type="button" id="files-btn" class="files-btn" title="산출물과 검토 자료 보기">📁 산출물</button>
    <button type="button" id="reset-btn" class="files-btn reset-btn" title="에이미·제임스의 이전 대화 기억을 비우고 새 작업을 시작합니다(회사를 바꿀 때)">🔄 새 작업</button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <div id="files-tray" class="files-tray" hidden></div>

  <div id="file-list" aria-label="업로드된 자료"></div>

  <form id="composer">
    <label class="icon-btn pixel-box" title="자료 첨부 (inputs/에 저장됩니다)" aria-label="자료 첨부">
      <svg viewBox="0 0 9 9" fill="#4c83ff" aria-hidden="true"><rect x="4" y="1" width="1" height="7"/><rect x="1" y="4" width="7" height="1"/></svg>
      <input type="file" id="file-input" multiple hidden />
    </label>
    <textarea
      id="message-input"
      rows="1"
      placeholder="메시지 입력 (Enter 전송 · Shift+Enter 줄바꿈)"
      autocomplete="off"
    ></textarea>
    <button id="send-btn" class="pixel-box" type="submit" aria-label="전송">
      <svg viewBox="0 0 9 9" fill="#fff" aria-hidden="true"><rect x="1" y="1" width="2" height="1"/><rect x="1" y="2" width="4" height="1"/><rect x="1" y="3" width="6" height="1"/><rect x="1" y="4" width="8" height="1"/><rect x="1" y="5" width="6" height="1"/><rect x="1" y="6" width="4" height="1"/><rect x="1" y="7" width="2" height="1"/></svg>
    </button>
  </form>

  <script src="markdown.js"></script>
  <script src="client.js"></script>
</body>
</html>
